<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiosco Caja</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--ac:#0f7b5f;--acx:#fff;--ln:#e2e0d8;--rd:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#161715;--card:#1f211e;--tx:#ecebe6;--mu:#9a9990;--ac:#3ec99f;--acx:#0b1511;--ln:#33362f;--rd:#ff8a80}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
button{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
button.on,button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.d{color:var(--rd)}
input,select{font:inherit;width:100%;padding:9px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--tx)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--ln);font-size:15px}
.row:last-child{border:0}.mu{color:var(--mu);font-size:13px}
.in{color:var(--ac);font-weight:600}.out{color:var(--rd);font-weight:600}
.big{font-size:26px;font-weight:700}
.users{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.users button{padding:18px 10px;font-weight:600}
#cp{display:none}
@media print{header,.tabs,.noprint{display:none!important}.pk-sheet .card:not(#sheet),.pk-ticket .card:not(#ticket){display:none!important}#ticket{border:0;font-family:monospace}.pk-copy main{display:none!important}.pk-copy #cp{display:block!important}}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

var sb,K=null,ST=[],me=null,shift=null,tab="",cart=[],pend=null,lastT=null,fdate="",mode="login",pinFor=null;
var PM=["Efectivo","Transferencia","Tarjeta","Mercado Pago"],PMC=PM.concat(["Cuenta corriente"]),cust=[];
function cn(id){var c=cust.find(function(x){return x.id==id});return c?c.name:""}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $$(n){return "$ "+Math.round(Number(n)).toLocaleString("es-AR")}
function val(i){var e=$(i);return e?e.value.trim():""}
function hm(t){return new Date(t).toTimeString().slice(0,5)}
function ld(d){return d.toLocaleDateString("sv-SE")}
function nowT(){return new Date().toTimeString().slice(0,5)}
function nm(id){var s=ST.find(function(x){return x.id==id});return s?s.name:"?"}

function sum(a){return a.reduce(function(t,x){return t+Number(x.amount)},0)}
function tot(E){var i=sum(E.filter(function(x){return x.kind=="income"})),e=sum(E.filter(function(x){return x.kind=="expense"})),c=sum(E.filter(function(x){return x.kind=="income"&&x.method=="Efectivo"}))-e;return{i:i,e:e,n:i-e,cash:c}}
function byM(E){return PM.map(function(m){var v=sum(E.filter(function(x){return x.kind=="income"&&x.method==m}));return v?'<div class="row"><span class="mu">Cobrado en '+m+'</span><span>'+$$(v)+'</span></div>':''}).join("")}
function hdr(){return '<header><h1>🏪 '+esc(K?K.name:"Kiosco Caja")+'</h1><div>'+(me?'<span class="mu">'+esc(me.name)+'</span> <button data-a="switch">Cambiar usuario</button> ':'')+(K?'<button data-a="logout">Salir del kiosco</button>':'')+'</div></header>'}
async function hash(p,id){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(p+id));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}

/* ---------- Acceso ---------- */
async function loadKiosk(){K=chk(await sb.from("kiosks").select("*").single());ST=chk(await sb.from("staff").select("*").order("created_at"))}
async function doLogin(){var r=await sb.auth.signInWithPassword({email:val("em"),password:val("pw")});if(r.error){alert(r.error.message);return}await loadKiosk();render()}
async function doSignup(){var r=await sb.auth.signUp({email:val("em"),password:val("pw"),options:{data:{kiosk_name:val("kn")||"Mi kiosco"}}});if(r.error){alert(r.error.message);return}
 if(!r.data.session){alert("Te enviamos un mail para confirmar la cuenta. Confirmalo y después entrá.");mode="login";render();return}await loadKiosk();render()}
async function enter(u){me=u;tab=u.role=="admin"?"res":"tic";shift=null;if(u.role!="admin"){shift=(await sb.from("shifts").select("*").eq("staff_id",u.id).is("ended_at",null).maybeSingle()).data}}
function loginView(){var su=mode=="signup";$("app").innerHTML=hdr()+'<div class="card"><h2>'+(su?'Crear cuenta del kiosco':'Entrar al kiosco')+'</h2>'+(su?'<input id="kn" placeholder="Nombre del kiosco" style="margin-bottom:8px">':'')+'<input id="em" type="email" placeholder="Mail del dueño" style="margin-bottom:8px"><input id="pw" type="password" placeholder="Contraseña (mínimo 6)" style="margin-bottom:8px"><div class="g"><button class="p" data-a="'+(su?'signup':'login')+'">'+(su?'Crear cuenta':'Entrar')+'</button><button data-a="mode">'+(su?'Ya tengo cuenta':'Crear cuenta nueva')+'</button></div></div>'}
function pickView(){var h=hdr()+'<div class="card"><h2>¿Quién sos?</h2><div class="users">'+ST.filter(function(x){return x.active}).map(function(u){return '<button data-a="pick" data-id="'+u.id+'">'+(u.role=="admin"?"🔑 ":"👤 ")+esc(u.name)+'</button>'}).join("")+'</div>';
 if(pinFor){var nw=!pinFor.pin_hash;h+='<div style="margin-top:12px"><div class="mu">'+(nw?'Primera vez: elegí un PIN de 4 a 6 números':'PIN del administrador')+'</div><div class="g"><input id="pin" type="password" inputmode="numeric" maxlength="6"><button class="p" data-a="pin">'+(nw?'Guardar PIN y entrar':'Entrar')+'</button></div></div>'}
 $("app").innerHTML=h+'</div>'}

/* ---------- Empleado ---------- */
async function empView(){
 var h=hdr();
 if(!shift){
  h+='<div class="card"><h2>Iniciar turno</h2><div class="mu">Marcá tu hora de ingreso</div><div class="g"><input id="hs" type="time" value="'+nowT()+'"><button class="p" data-a="start">Empezar caja</button></div></div>';
  var L=chk(await sb.from("shifts").select("*").eq("staff_id",me.id).not("ended_at","is",null).order("started_at",{ascending:false}).limit(3));
  if(L.length){var EE=chk(await sb.from("entries").select("*").in("shift_id",L.map(function(x){return x.id})));
   h+='<div class="card"><h2>Tus últimos turnos</h2>'+L.map(function(s){return '<div class="row"><span>'+s.work_date+' · '+hm(s.started_at)+'–'+hm(s.ended_at)+'</span><b>'+$$(tot(EE.filter(function(e){return e.shift_id==s.id})).n)+'</b></div>'}).join("")+'</div>'}
  $("app").innerHTML=h;return}
 var E=chk(await sb.from("entries").select("*").eq("shift_id",shift.id).order("created_at")),t=tot(E);
 h+='<div class="card"><div class="mu">Turno desde '+hm(shift.started_at)+' hs</div><div class="big">'+$$(t.n)+'</div><div class="mu">Ingresos '+$$(t.i)+' · Gastos '+$$(t.e)+'</div></div>';
 h+='<div class="tabs">'+[["tic","Venta"],["cc","Cuentas"],["inc","Otros ingresos"],["exp","Gastos"],["ped","Pedido"],["cie","Cierre"]].map(function(x){return '<button class="'+(tab==x[0]?"on":"")+'" data-a="tab" data-t="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div>';
 if(tab=="inc"||tab=="exp"){var inc=tab=="inc";
  h+='<div class="card"><h2>'+(inc?'Registrar otro ingreso (no es una venta de productos)':'Registrar gasto / pago')+'</h2><div class="g"><input id="c" placeholder="Concepto"><input id="w" placeholder="'+(inc?'Quién pagó (opcional)':'A quién se le pagó')+'"></div><div class="g">'+(inc?'<select id="m">'+PM.map(function(x){return '<option>'+x+'</option>'}).join("")+'</select>':'')+'<input id="a" type="number" inputmode="decimal" placeholder="Monto"></div><button class="p" data-a="addentry">Agregar</button></div>';
  var L2=E.filter(function(x){return x.kind==(inc?"income":"expense")});
  h+='<div class="card">'+(L2.length?L2.map(function(x){return '<div class="row"><span>'+esc(x.concept)+' <span class="mu">'+(inc?(x.method||"")+(x.counterpart?' · pagó: '+esc(x.counterpart):''):'→ '+esc(x.counterpart||"s/d")+' · pagó '+esc(me.name))+'</span></span><span class="'+(inc?"in":"out")+'">'+$$(x.amount)+' <button class="d" data-a="delentry" data-id="'+x.id+'">✕</button></span></div>'}).join(""):'<div class="mu">Sin registros todavía</div>')+'</div>'}
 if(tab=="tic")h+=await ticTab();
 if(tab=="ped")h+=await pedHTML();
 if(tab=="cc")h+=await ccHTML();
 if(tab=="cie"){var TK=chk(await sb.from("tickets").select("total,method").eq("shift_id",shift.id)),vt=TK.reduce(function(x,y){return x+Number(y.total)},0),fi=TK.filter(function(y){return y.method=="Cuenta corriente"}).reduce(function(x,y){return x+Number(y.total)},0);
  h+='<div class="card"><h2>Cierre de caja</h2><div class="row"><span>Ventas del turno</span><b>'+$$(vt)+'</b></div>'+(fi?'<div class="row"><span class="mu">de las cuales a cuenta corriente (fiado)</span><span>'+$$(fi)+'</span></div>':'')+'<div class="row"><span>Total cobrado (incluye otros ingresos y pagos de cuentas)</span><span class="in">'+$$(t.i)+'</span></div>'+byM(E)+'<div class="row"><span>Gastos</span><span class="out">'+$$(t.e)+'</span></div><div class="row"><b>Total neto cobrado</b><b>'+$$(t.n)+'</b></div><div class="row"><span>Efectivo esperado en caja</span><b>'+$$(t.cash)+'</b></div><div class="g" style="margin-top:10px"><input id="cnt" type="number" inputmode="decimal" placeholder="Efectivo contado"><input id="hf" type="time" value="'+nowT()+'"></div><button class="p" data-a="close">Cerrar turno</button></div>'}
 $("app").innerHTML=h;var f=$("bc");if(f&&!pend)f.focus()}

/* ---------- Ticket ---------- */
function cartTot(){return cart.reduce(function(t,x){return t+x.p*x.q},0)}
function addCart(n,p,q,c){var x=cart.find(function(y){return c?y.c==c:(y.n==n&&y.p==p)});if(x)x.q+=q;else cart.push({n:n,p:p,q:q,c:c||""})}
async function scanSubmit(c){c=(c||"").trim();if(!c)return;var p=(await sb.from("products").select("*").eq("barcode",c).maybeSingle()).data;if(p){addCart(p.name,Number(p.price),1,c);pend=null}else pend=c;render()}
function tView(t,items){return '<div class="card" id="ticket"><div style="text-align:center"><b>'+esc(K.name)+'</b><br><span class="mu">Comprobante de compra · no válido como factura</span><br><span class="mu">N.º '+String(t.number).padStart(5,"0")+' · '+ld(new Date(t.created_at))+' '+hm(t.created_at)+'</span></div><hr>'+items.map(function(x){return '<div class="row"><span>'+x.qty+' × '+esc(x.name)+'</span><span>'+$$(x.price*x.qty)+'</span></div>'}).join("")+'<div class="row"><b>TOTAL</b><b>'+$$(t.total)+'</b></div><div class="mu">Pago: '+t.method+(t.customer_id?' ('+esc(cn(t.customer_id))+')':'')+' · Atendió: '+esc(nm(t.staff_id))+'</div><div style="text-align:center;margin-top:8px">¡Gracias por tu compra!</div></div>'}
function ticHTML(){
 if(lastT)return tView(lastT.t,lastT.items)+'<div class="noprint g"><button data-a="tprint">🖨 Imprimir ticket</button><button class="p" data-a="tnew">Nuevo ticket</button></div>';
 var h='<div class="card"><h2>Código de barras</h2><div class="mu">Con lector: escaneá y listo. O usá la cámara / escribí el código.</div><div class="g" style="margin-top:8px"><input id="bc" inputmode="numeric" placeholder="Código de barras"><button class="p" data-a="scan">Agregar</button><button data-a="cam">📷 Cámara</button></div><div id="cam"></div>';
 if(pend)h+='<div class="mu" style="margin-top:8px">Código nuevo '+esc(pend)+': cargalo una sola vez y queda guardado.</div><div class="g"><input id="pn" placeholder="Nombre"><input id="pp" type="number" inputmode="decimal" placeholder="Precio"><button class="p" data-a="saveprod">Guardar y agregar</button></div>';
 h+='</div><div class="card"><h2>A mano</h2><div class="g"><input id="mn" placeholder="Producto"><input id="mp" type="number" inputmode="decimal" placeholder="Precio"><input id="mq" type="number" value="1"></div><button data-a="madd">Agregar</button></div>';
 return h+'<div class="card"><h2>Ticket actual</h2>'+(cart.length?cart.map(function(x,i){return '<div class="row"><span>'+x.q+' × '+esc(x.n)+' <span class="mu">'+$$(x.p)+'</span></span><span>'+$$(x.p*x.q)+' <button class="d" data-a="tdel" data-i="'+i+'">✕</button></span></div>'}).join(""):'<div class="mu">Sin productos</div>')+'<div class="row"><b>Total</b><b class="big">'+$$(cartTot())+'</b></div><div class="g"><select id="tm">'+PMC.map(function(x){return '<option>'+x+'</option>'}).join("")+'</select><select id="tc"><option value="">Cliente (solo cuenta corriente)</option>'+cust.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join("")+'</select><button class="p" data-a="tcob">Cobrar y emitir ticket</button></div></div>'}
async function cobrar(){if(!cart.length)return;var tt=cartTot(),m=val("tm")||"Efectivo",cid=val("tc")||null,fi=m=="Cuenta corriente";
 if(fi&&!cid){alert("Elegí el cliente de la cuenta corriente");return}
 var t=chk(await sb.from("tickets").insert({kiosk_id:K.id,shift_id:shift.id,staff_id:me.id,method:m,total:tt,customer_id:fi?cid:null}).select().single());
 var items=cart.map(function(x){return{kiosk_id:K.id,ticket_id:t.id,name:x.n,barcode:x.c||null,price:x.p,qty:x.q}});
 chk(await sb.from("ticket_items").insert(items));
 if(fi)chk(await sb.from("account_movements").insert({kiosk_id:K.id,customer_id:cid,kind:"charge",amount:tt,ticket_id:t.id,shift_id:shift.id,staff_id:me.id,note:"Venta ticket #"+t.number}));
 else chk(await sb.from("entries").insert({kiosk_id:K.id,shift_id:shift.id,kind:"income",concept:"Venta ticket #"+t.number,method:m,amount:tt,ticket_id:t.id}));
 lastT={t:t,items:items};cart=[]}
async function ticTab(){
 cust=chk(await sb.from("customers").select("*").eq("active",true).order("name"));
 var h=ticHTML(),T=chk(await sb.from("tickets").select("*, ticket_items(*)").eq("shift_id",shift.id).order("created_at",{ascending:false}));window._T=T;
 return h+'<div class="card noprint"><h2>Ventas de este turno</h2>'+(T.length?T.map(function(t){return '<div class="row"><span>#'+t.number+' · '+hm(t.created_at)+' <span class="mu">'+t.method+(t.customer_id?' · '+esc(cn(t.customer_id)):'')+' · '+t.ticket_items.length+' ítems</span></span><span>'+$$(t.total)+' <button data-a="tview" data-id="'+t.id+'">Ver</button></span></div>'}).join(""):'<div class="mu">Sin ventas todavía</div>')+'</div>'}
async function ccHTML(){
 var C=chk(await sb.from("customers").select("*").eq("active",true).order("name")),M=chk(await sb.from("account_movements").select("*").order("created_at",{ascending:false}).limit(2000)),bal={};
 M.forEach(function(m){bal[m.customer_id]=(bal[m.customer_id]||0)+(m.kind=="charge"?1:-1)*Number(m.amount)});
 var total=C.reduce(function(s,c){return s+(bal[c.id]||0)},0);
 var h='<div class="card"><h2>Cuentas corrientes</h2><div class="mu">Clientes que compran fiado. Para vender a cuenta, elegí "Cuenta corriente" en la pestaña Venta.</div><div class="row"><b>Total que te deben</b><b class="out">'+$$(total)+'</b></div><div class="g" style="margin-top:8px"><input id="cn" placeholder="Nombre del cliente"><input id="cph" placeholder="Teléfono (opcional)"><button class="p" data-a="custadd">Agregar cliente</button></div></div>';
 return h+(C.length?C.map(function(c){var b=bal[c.id]||0,mv=M.filter(function(m){return m.customer_id==c.id}).slice(0,5);
  return '<div class="card"><div class="row"><b>'+esc(c.name)+(c.phone?' <span class="mu">'+esc(c.phone)+'</span>':'')+'</b><b class="'+(b>0?"out":"in")+'">'+(b>0?'Debe '+$$(b):'Al día')+'</b></div>'+mv.map(function(m){return '<div class="row"><span class="mu">'+ld(new Date(m.created_at))+' · '+(m.kind=="charge"?esc(m.note||"Compra"):"Pago"+(m.method?" ("+m.method+")":""))+'</span><span class="'+(m.kind=="charge"?"out":"in")+'">'+(m.kind=="charge"?"+":"−")+$$(m.amount)+'</span></div>'}).join("")+(b>0?'<div class="g" style="margin-top:8px"><input id="pa'+c.id+'" type="number" inputmode="decimal" placeholder="Monto que paga"><select id="pm'+c.id+'">'+PM.map(function(x){return '<option>'+x+'</option>'}).join("")+'</select><button class="p" data-a="custpay" data-id="'+c.id+'">Registrar pago</button></div>':'')+'</div>'}).join(""):'<div class="card mu">Todavía no hay clientes</div>')}
function startCam(){if(!("BarcodeDetector" in window)||!navigator.mediaDevices){alert("Este navegador no soporta escaneo con cámara. Usá un lector o escribí el código.");return}
 var v=document.createElement("video");v.setAttribute("playsinline","");v.style.cssText="width:100%;border-radius:9px;margin-top:8px";$("cam").appendChild(v);
 navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(st){v.srcObject=st;v.play();var d=new BarcodeDetector(),on=true;(function loop(){if(!on)return;d.detect(v).then(function(r){if(r.length){on=false;st.getTracks().forEach(function(t){t.stop()});scanSubmit(r[0].rawValue)}else setTimeout(loop,300)}).catch(function(){setTimeout(loop,300)})})()}).catch(function(){alert("No se pudo abrir la cámara")})}

/* ---------- Pedidos (hoja única + copias) ---------- */
function oTxt(items,sup,head){return "Pedido de mercadería"+(head?" – "+head:"")+(sup?" – "+sup:"")+"\n"+items.map(function(x){return "• "+x.qty+" × "+x.name+" (pidió "+nm(x.requested_by)+")"}).join("\n")}
async function pedHTML(){
 var it=chk(await sb.from("order_items").select("*").is("batch_id",null).order("created_at"));
 var B=chk(await sb.from("order_batches").select("*").order("sent_at",{ascending:false}).limit(20));
 var BI=B.length?chk(await sb.from("order_items").select("*").in("batch_id",B.map(function(b){return b.id}))):[];
